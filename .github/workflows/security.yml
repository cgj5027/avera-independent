name: Security and validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avera
          POSTGRES_DB: avera_test
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U avera -d avera_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AVERA_TEST_POSTGRES_URL: postgresql://avera@127.0.0.1:5432/avera_test
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Scan available Git history for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact .
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run test:local
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:backend
      - run: npm run typecheck:platform
      - run: npm run build
      - run: npm run check:independent
      - name: Install browser for fixture acceptance checks
        run: npx playwright install --with-deps chromium
      - name: Run responsive and accessibility fixture checks
        shell: bash
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/avera-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import { setTimeout } from 'node:timers/promises';
          let ready = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const response = await fetch(process.env.AUDIT_BASE_URL, { signal: AbortSignal.timeout(1000) });
              if (response.ok) { ready = true; break; }
            } catch {}
            await setTimeout(1000);
          }
          if (!ready) throw new Error('Local preview did not become ready');
          JS
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npm run test:stage3:browser
      - run: npm run build:local
      - name: Run real independent browser workflows and process restart
        shell: bash
        run: |
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npm run test:local:browser
          npm run test:stage5:browser
          npm run test:recovery:browser
          npm run test:mcp:browser
          npm run package:desktop -- "$RUNNER_TEMP/avera-browser-package"
          AVERA_TEST_DESKTOP_PACKAGE="$RUNNER_TEMP/avera-browser-package" npm run test:local:browser
  desktop-preview:
    name: Desktop preview (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:local
      - run: npm run test:desktop
      - run: npm run package:desktop
      - run: node release/avera-desktop/scripts/verify-desktop.mjs
      - name: Archive the verified preview with a checksum
        shell: bash
        run: |
          tar -czf release/avera-${{ runner.os }}-node${{ matrix.node }}.tar.gz -C release avera-desktop
          node --input-type=module <<'JS'
          import {readFile,writeFile,readdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          for(const name of await readdir('release'))if(name.endsWith('.tar.gz')){
            const hash=createHash('sha256').update(await readFile('release/'+name)).digest('hex');
            await writeFile('release/'+name+'.sha256',hash+'  '+name+'\n');
          }
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avera-desktop-${{ runner.os }}-node${{ matrix.node }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
